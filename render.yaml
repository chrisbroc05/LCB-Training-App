services:
  - type: web
    name: lcb-training-web
    env: node
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run prisma:deploy && npm start
    envVars:
      - key: NODE_VERSION
        value: 20.x

  - type: cron
    name: program-emails
    runtime: node
    schedule: "0,30 * * * *"
    buildCommand: "true"
    startCommand: curl -sS -f -X POST "${APP_URL}/api/cron/program-emails" -H "Authorization: Bearer ${CRON_SECRET}"
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: APP_URL
        fromService:
          name: lcb-training-web
          type: web
          envVarKey: NEXTAUTH_URL
