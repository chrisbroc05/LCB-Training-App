services:
  - type: web
    name: lcb-training-web
    env: node
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run prisma:deploy && npm start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      # Leave headroom under Render's 2 GB so GC can reclaim before OOM.
      - key: NODE_OPTIONS
        value: --max-old-space-size=1536
