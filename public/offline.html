<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LCB Training -- Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0A1628;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      border-radius: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      font-size: 16px;
      color: #aaaaaa;
      margin-bottom: 32px;
      max-width: 280px;
      line-height: 1.5;
    }
    button {
      background-color: #52B788;
      color: #0A1628;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .tagline {
      margin-top: 48px;
      font-size: 13px;
      color: #52B788;
      font-style: italic;
    }
  </style>
</head>
<body>
  <img src="/apple-touch-icon.png" alt="LCB Training" class="logo" onerror="this.style.display='none'" />
  <h1>LCB Training</h1>
  <p>You appear to be offline. Reconnect to continue your training.</p>
  <button onclick="window.location.reload()">Try Again</button>
  <p class="tagline">Work Hard. Be Memorable.</p>
  <script>
    window.addEventListener('online', function() {
      window.location.reload()
    })
  </script>
</body>
</html>
